<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="login-container">
    <form class="login-form" method="POST">
        <h2>Iniciar Sesion</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="error-message">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <div class="form-group">
          <input  type="text" name="usuario" placeholder="Usuario" required>
        </div>  
        
        <div class="form-group">
          <input  type="password" name="contrasena" placeholder="Contraseña" required>
        </div>

        <button type="submit" class="btn">Entrar</button>

        <!-- Separador -->
        <div style="text-align: center; margin: 20px 0; color: #666;">
          <span>o</span>
        </div>

        <!-- Botón de Google -->
        <div id="g_id_onload"
             data-client_id="{{ google_client_id }}"
             data-callback="handleGoogleLogin">
        </div>
        
        <div class="g_id_signin" 
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="continue_with"
             data-shape="rectangular"
             data-logo_alignment="left"
             data-width="100%">
        </div>

        <div class="login-link">
          <p><a class="login-text" href="{{ url_for('recuperar_contrasena') }}">¿Olvidaste tu contraseña?</a></p>
        </div>


        <div class="login-link">
          <p><a class="login-text" href="{{ url_for('registro') }}">Crear cuenta</a></p>
        </div>
    </form>
</div>

<!-- JavaScript para manejar login con Google -->
<script>
/**
 * Callback que se ejecuta cuando el usuario inicia sesión con Google
 * @param {Object} response - Respuesta de Google con el credential (JWT token)
 */
function handleGoogleLogin(response) {
    // Obtener el idToken (JWT) de la respuesta
    const idToken = response.credential;
    
    // Mostrar indicador de carga (opcional)
    const googleBtn = document.querySelector('.g_id_signin');
    if (googleBtn) {
        googleBtn.style.opacity = '0.5';
        googleBtn.style.pointerEvents = 'none';
    }
    
    // Enviar el token al backend
    fetch('/auth/google', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ idToken: idToken })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Login exitoso - redirigir al perfil
            console.log('✅ Login con Google exitoso:', data.message);
            window.location.href = '/mi_perfil';
        } else {
            // Error en el login
            console.error('❌ Error:', data.error);
            alert('Error al iniciar sesión con Google: ' + (data.error || 'Desconocido'));
            
            // Restaurar botón
            if (googleBtn) {
                googleBtn.style.opacity = '1';
                googleBtn.style.pointerEvents = 'auto';
            }
        }
    })
    .catch(error => {
        // Error de red o del servidor
        console.error('❌ Error de conexión:', error);
        alert('Error de conexión. Por favor, intenta nuevamente.');
        
        // Restaurar botón
        if (googleBtn) {
            googleBtn.style.opacity = '1';
            googleBtn.style.pointerEvents = 'auto';
        }
    });
}
</script>

</body>
</html>
